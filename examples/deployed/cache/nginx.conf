# A cache that stores everything for a minute whatever the origin says (proxy_ignore_headers),
# keyed by path alone: the misconfiguration contract section 10a warns about.
#   nginx -p <scratch dir> -c <this file>   (cache, logs and temp files go under the prefix)
# Replace ORIGIN_HOST with the host of your deployment of ../origin first.
worker_processes 1;
pid nginx.pid;
error_log error.log;
events { worker_connections 64; }
http {
  access_log access.log;
  client_body_temp_path tmp; proxy_temp_path tmp; fastcgi_temp_path tmp; uwsgi_temp_path tmp; scgi_temp_path tmp;
  proxy_cache_path cache keys_zone=pages:1m;
  server {
    listen 127.0.0.1:8088;
    location / {
      proxy_pass https://ORIGIN_HOST;
      proxy_ssl_server_name on;
      proxy_set_header Host ORIGIN_HOST;
      proxy_cache pages;
      proxy_cache_key $uri;
      proxy_ignore_headers Cache-Control Expires Set-Cookie;
      proxy_cache_valid 200 60s;
      add_header X-Cache $upstream_cache_status always;
    }
  }
}
